<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고전독서 박람회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9eff0;--paper:#fbfdfc;--ink:#14272b;--muted:#51666b;--line:#c3d0d2;--soft:#dcebec;
  --accent:#0b5c6b;--on-accent:#fff;--stamp:#b3261e;--notice:#fff2c9;--notice-ink:#574300;
  --board:#0d1f24;--board-2:#183239;--board-ink:#f1f7f6;--board-muted:#9fb8bb;--board-hot:#ffb74d;--board-over:#ff8a80;
  --wood:#a06b3c;--wood-2:#6e4526;
  --display:"Do Hyeon","Gowun Dodum","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10191c;--paper:#1a262a;--ink:#e6f0f0;--muted:#a0b3b6;--line:#34464b;--soft:#24363b;
  --accent:#6cc5d4;--on-accent:#06262c;--stamp:#ff9d94;--notice:#3b3210;--notice-ink:#f5e2a0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.brand{font:400 1.25rem var(--display);color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{color:var(--muted);text-decoration:none;font:400 1.05rem var(--display);padding:8px 12px;border-radius:8px;min-height:40px}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tab.quiet{font:.9rem var(--body);margin-left:auto}
.view{max-width:1240px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:18px}
.lede{color:var(--muted)}
.h1{font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1.2}
.h2{font-size:1.4rem}
.btn{font:400 1.02rem var(--display);min-height:44px;padding:7px 15px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled,.btn.off{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lab{font:400 1rem var(--display)}
input[type=text],input[type=url],input[type=password],input[type=search],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%;max-width:100%}
textarea{min-height:76px;resize:vertical}
.err{color:var(--stamp);font-size:.94rem}
.ok{color:var(--accent);font-size:.94rem}
.small{font-size:.87rem;color:var(--muted)}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.notice{background:var(--notice);color:var(--notice-ink);padding:10px 14px;border-radius:8px}
.tablebox{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font:400 .95rem var(--display);color:var(--muted)}
td.code{color:var(--stamp);font-family:var(--display)}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
tr.on td{background:var(--soft)}
td.nowcol,th.nowcol{background:var(--notice);color:var(--notice-ink)}
.free{color:var(--muted)}

/* 전자칠판 */
.bwrap{background:var(--board);color:var(--board-ink);min-height:calc(100vh - 58px);padding:clamp(14px,2.5vw,32px);display:grid;grid-template-rows:auto 1fr auto;gap:clamp(10px,2vh,24px)}
.bwrap:fullscreen{min-height:100vh}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;align-items:baseline}
.bphase{font:400 clamp(1.2rem,2.4vw,2rem) var(--display);color:var(--board-muted)}
.bclock{font:500 clamp(1.3rem,3vw,2.6rem) var(--mono);font-variant-numeric:tabular-nums}
.bclock small{font:400 clamp(.9rem,1.5vw,1.2rem) var(--body);color:var(--board-muted);margin-left:10px}
.bmain{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(6px,1.6vh,18px);min-width:0}
.btime{font:500 min(15vw,34vh)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap}
.btime.hot{color:var(--board-hot)}.btime.over{color:var(--board-over)}.btime.paused{opacity:.55}
.btitle{font:400 clamp(1.6rem,3.6vw,3.2rem)/1.2 var(--display);word-break:keep-all}
.btitle.sm{font-size:clamp(1.2rem,2.4vw,2rem);color:var(--board-muted)}
.bmsg{font:400 clamp(2.2rem,5.6vw,5.4rem)/1.3 var(--display);white-space:pre-line;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;max-width:min(100%,20em)}
.btodo{font-size:clamp(1.3rem,2.8vw,2.5rem);line-height:1.35;white-space:pre-line;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;max-width:min(100%,24em)}
.bnext{font-size:clamp(1rem,1.6vw,1.35rem);color:var(--board-muted);margin-top:6px}
.strip{display:flex;gap:3px}
.seg{min-width:0;padding-top:8px;border-top:8px solid var(--board-2);font-size:clamp(.72rem,1.15vw,1rem);color:var(--board-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.done{border-top-color:var(--board-muted)}
.seg.now{border-top-color:var(--board-hot);color:var(--board-ink)}
.bctl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.bbtn{font:400 1rem var(--display);min-height:42px;padding:5px 13px;border:1.5px solid var(--board-muted);border-radius:8px;background:transparent;color:var(--board-ink);cursor:pointer}
.bbtn.main{background:var(--board-hot);border-color:var(--board-hot);color:#2b1a00}
@media (max-width:760px){.btime{font-size:24vw}.seg{font-size:0;padding-top:4px}}

/* 책 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px 14px}
.bk{all:unset;cursor:pointer;display:grid;gap:6px;align-content:start;min-width:0}
.bk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bk:hover .cover{transform:translateY(-3px)}
.bk-title{font:400 1.08rem/1.25 var(--display)}
.bk-tag{font-size:.82rem;color:var(--muted)}
.cover{aspect-ratio:2/3;border-radius:3px 8px 8px 3px;overflow:hidden;position:relative;box-shadow:inset 7px 0 0 rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.2);transition:transform .15s;width:100%;max-width:100%;container-type:inline-size}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--paper)}
.cv{position:absolute;inset:0;padding:11cqw 9cqw 8cqw 14cqw;display:flex;flex-direction:column;background:var(--c1);color:var(--c2)}
.cv::before{content:"";position:absolute;inset:auto 0 0 0;height:42%;opacity:.4}
.p0 .cv::before{background:repeating-linear-gradient(135deg,var(--c2) 0 2cqw,transparent 2cqw 7cqw)}
.p1 .cv::before{background:radial-gradient(circle,var(--c2) 1.6cqw,transparent 1.8cqw) 0 0/9cqw 9cqw}
.p2 .cv::before{background:repeating-radial-gradient(circle at 80% 100%,var(--c2) 0 1.5cqw,transparent 1.5cqw 7cqw)}
.p3 .cv::before{background:repeating-linear-gradient(0deg,var(--c2) 0 1.5cqw,transparent 1.5cqw 6cqw)}
.cv b{font:400 12.5cqw/1.15 var(--display);position:relative;word-break:keep-all}
.cv i{font:normal 6.4cqw/1.3 var(--body);margin-top:5cqw;position:relative;opacity:.9}
.cv u{text-decoration:none;font-size:6cqw;margin-top:auto;position:relative;background:var(--c1);padding:1cqw 2cqw;align-self:flex-start}

/* 책장 */
.shelf{display:grid;gap:0}
.plate{justify-self:start;background:var(--wood-2);color:#f6e9d4;font-size:1.08rem;padding:3px 14px;border-radius:6px 6px 0 0}
.rowbox{overflow-x:auto;overflow-y:hidden;background:linear-gradient(#2c2019,#3d2c20);padding-top:26px;scrollbar-width:thin}
.shelfrow{display:flex;align-items:flex-end;gap:3px;height:310px;width:max-content;min-width:100%;padding:0 16px;justify-content:center}
.plank{height:16px;background:linear-gradient(var(--wood),var(--wood-2));box-shadow:0 6px 10px rgba(0,0,0,.28);border-radius:0 0 3px 3px}
.end{align-self:flex-end;height:66%;writing-mode:vertical-rl;background:#e9dcc6;color:#3c2a1c;font:400 .86rem var(--display);padding:10px 6px;margin:0 7px;border-radius:3px 3px 0 0;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.spine{position:relative;flex:none;width:var(--w);height:var(--h);padding:0;border:0;background:none;cursor:pointer;color:var(--c2);transition:transform .2s ease;transform-origin:bottom center}
.spine:focus-visible{outline:3px solid #ffd76e;outline-offset:1px}
.sp{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.26),transparent 14%,transparent 84%,rgba(0,0,0,.3)),var(--c1);border-radius:3px 3px 0 0;writing-mode:vertical-rl;display:flex;flex-direction:column;gap:2px;align-items:flex-start;justify-content:flex-start;padding:14px 4px 10px;overflow:hidden;text-align:left}
.sp b{font:400 1.08rem/1.15 var(--display)}
.sp i{font:normal .72rem/1.1 var(--body);opacity:.85;margin-top:auto}
.pop{position:absolute;left:0;bottom:6px;width:172px;z-index:3;pointer-events:none;opacity:0;visibility:hidden;transform:perspective(700px) rotateY(-68deg) translateX(-8px);transform-origin:left center;transition:transform .28s ease,opacity .18s ease,visibility 0s linear .28s}
.pop .cover{box-shadow:0 12px 26px rgba(0,0,0,.55)}
.pr .pop{left:auto;right:0;transform-origin:right center;transform:perspective(700px) rotateY(68deg) translateX(8px)}
@media (hover:hover){
 .spine:hover{transform:translateY(-14px);z-index:4}
 .spine:hover .pop{opacity:1;visibility:visible;transform:none;transition:transform .28s ease,opacity .18s ease}
}
.spine:focus-visible{transform:translateY(-14px);z-index:4}
.spine:focus-visible .pop{opacity:1;visibility:visible;transform:none}
.spine.pulling{transform:translateY(-22px) scale(1.07);z-index:5}
.enter .spine{animation:shelve .42s cubic-bezier(.2,.8,.25,1) backwards;animation-delay:var(--d)}
@keyframes shelve{from{transform:translateY(-34px) rotate(3deg);opacity:0}}
.dialog.opening{animation:bookOpen .3s ease;transform-origin:left center}
@keyframes bookOpen{from{transform:perspective(1200px) rotateY(-24deg) scale(.94);opacity:0}}
@media (hover:none){.pop{display:none}}
@media (prefers-reduced-motion:reduce){.enter .spine,.dialog.opening{animation:none}.pop{transform:none}}
/* 상세·확대 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,18,22,.72);display:grid;place-items:start center;overflow:auto;padding:24px 16px}
.dialog{background:var(--paper);border-radius:14px;padding:20px;width:100%;max-width:880px;display:grid;gap:16px;min-width:0}
.d-top{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}
.d-top .cover{max-width:190px}
.d-info{display:grid;gap:8px;align-content:start;min-width:0}
.close{justify-self:end}
.rx{display:flex;flex-wrap:wrap;gap:8px}
.rxb{font:inherit;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.rxb[aria-pressed="true"]{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.clist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.clist li{border-bottom:1px solid var(--line);padding-bottom:8px;overflow-wrap:anywhere}
.nick{font:400 .98rem var(--display);color:var(--accent)}
@media (max-width:620px){.d-top{grid-template-columns:minmax(0,1fr)}.d-top .cover{max-width:150px}}

/* 입장권 */
.ticket{background:var(--paper);border:1.5px dashed var(--muted);border-radius:14px;padding:16px;display:grid;gap:12px}
.stubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stub{background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:4px;align-content:start;min-width:0}
.stub.me{background:var(--soft)}
.stub.now{box-shadow:0 0 0 3px var(--stamp)}
.when{font-size:.84rem;color:var(--muted)}
.where{font:400 1.3rem var(--display);color:var(--stamp)}
.what{font:400 1.06rem/1.3 var(--display)}
.who{font-size:.86rem;color:var(--muted)}
.stub textarea{min-height:58px;font-size:.92rem;padding:6px 8px}
@media (max-width:820px){.stubs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.stubs{grid-template-columns:minmax(0,1fr)}}

/* 소감판 */
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wide{grid-column:1/-1}
@media (max-width:700px){.formgrid{grid-template-columns:minmax(0,1fr)}}
.wall{columns:4 240px;column-gap:12px}
.post{break-inside:avoid;margin:0 0 12px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:13px;display:grid;gap:7px;overflow-wrap:anywhere}
.post .picks{font:400 1.02rem var(--display);color:var(--accent)}
.zoom{position:fixed;inset:0;z-index:30;background:var(--board);color:var(--board-ink);padding:clamp(18px,4vw,56px);display:grid;grid-template-rows:auto 1fr auto;gap:18px;overflow:auto}
.zbody{align-self:center;display:grid;gap:clamp(12px,3vh,32px);overflow-wrap:anywhere}
.zfeel{font-size:clamp(1.9rem,5vw,5rem);line-height:1.35;white-space:pre-wrap}
.zpick{font:400 clamp(1.3rem,2.8vw,2.6rem)/1.3 var(--display);color:var(--board-hot)}
.zreason{font-size:clamp(1.2rem,2.6vw,2.4rem);line-height:1.4;color:var(--board-muted);white-space:pre-wrap}

/* 교사 */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.steps{display:grid;gap:3px;max-height:360px;overflow:auto}
.stepb{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 9px;border-radius:6px}
.stepb:hover{background:var(--soft)}.stepb.now{background:var(--accent);color:var(--on-accent)}
.stepb:focus-visible{outline:3px solid var(--accent)}
.check{display:flex;gap:9px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.bookrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bookrow:last-child{border-bottom:0}
.bookrow .cover{max-width:72px}
.bookform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-width:0}
.bookform .t{grid-column:1/-1;font:400 1.08rem var(--display)}
@media (max-width:640px){.bookform{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand">고전독서 박람회</span><nav class="tabs" id="nav" aria-label="메뉴"></nav></div><p class="notice" id="noStore" hidden style="margin:0;border-radius:0">이 창에서는 저장과 새 탭 열기가 제한돼요. 파일을 내려받아 크롬에서 열어 주세요.</p></header>
<main id="app"></main>
<div id="layer"></div>

 var t=db.timer;

  db=load();t=db.timer;var moved=false;
  while(t.running&&Date.now()>=t.endsAt&&STEPS[t.i].auto&&t.i<STEPS.length-1){t.i++;t.endsAt+=STEPS[t.i].sec*1000;moved=true}

 +'<section class="panel"><h2 class="h2">책 자료 관리 <span class="small">링크 등록 '+linked+' / '+BOOKS.length+'권</span></h2><p class="small">입력하면 바로 저장돼요. 캔바는 보기 전용 링크를 넣어 주세요.</p><div class="row"><label class="btn ghost sm" for="bulk">표지 여러 장 한번에 올리기</label><input id="bulk" type="file" accept="image/*" multiple hidden data-bulk="1"><span class="small">파일 이름에 책 제목이나 YES24 번호가 들어 있으면 알아서 맞춰요.</span></div>'
 +'<div class="field"><label for="pasteL" class="lab">링크 한꺼번에 붙여 넣기</label><textarea id="pasteL" placeholder="한 줄에 한 명씩: 학생 이름이나 책 제목 + 링크&#10;예) 신지혜 https://www.canva.com/design/.../view"></textarea><div class="row"><button class="btn ghost sm" data-act="pasteLinks">붙여 넣은 링크 저장</button><span class="small">구글 폼 응답 시트에서 이름·링크 칸을 복사해 붙여 넣어도 돼요. 캔바 주소는 캔바 칸에, 나머지는 웹앱 칸에 들어가요.</span></div>'+(S.msg.links?'<p class="'+S.msg.links[0]+'">'+esc(S.msg.links[1])+'</p>':'')+'</div>'+(S.msg.bulk?'<p class="'+S.msg.bulk[0]+'">'+esc(S.msg.bulk[1])+'</p>':'')
 +(S.msg.book?'<p class="err">'+esc(S.msg.book)+'</p>':'')
 +BOOKS.map(function(b){var d=db.books[b.k]||{};function f(key,label,type){var bad=(key==="canva"||key==="web")&&d[key]&&!safeUrl(d[key]);return '<div class="field"><label class="small" for="'+key+b.i+'">'+label+'</label><input id="'+key+b.i+'" type="'+type+'" data-book="'+b.i+'" data-key="'+key+'" value="'+esc(d[key]||"")+'">'+(bad?'<span class="err">https://로 시작하는 주소를 넣어 주세요.</span>':'')+'</div>'}
  return '<div class="bookrow">'+coverHtml(b)+'<div class="bookform"><div class="t">'+esc(b.t)+' <span class="small">'+bookTag(b)+(presenter(b.k)?" · "+esc(presenter(b.k)):"")+'</span></div>'+f("canva","캔바 링크","url")+f("web","웹앱 링크","url")+f("intro","책 소개 (비우면 기본 소개)","text")+f("why","이 양식을 고른 이유","text")
  +'<div class="row"><label class="btn ghost sm" for="cov'+b.i+'">표지 올리기</label><input id="cov'+b.i+'" type="file" accept="image/*" hidden data-cover="'+b.i+'">'+(b.y?'<a class="btn ghost sm" href="https://image.yes24.com/goods/'+b.y+'/XL" target="_blank" rel="noopener noreferrer">YES24 표지 열기</a>':'')+(d.cover?'<button class="btn ghost sm" data-act="covDel" data-arg="'+b.i+'">표지 지우기</button>':'')+'</div></div></div>'}).join("")+'</section></div>';
}
function inField(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="file"}
function renderLayer(){
 var l=document.getElementById("layer"),top=(l.querySelector(".overlay")||{}).scrollTop||0;
 l.innerHTML=S.zoom!==null?vZoom():S.open!==null?vDetail(BOOKS[S.open]):"";
 var o=l.querySelector(".overlay");if(o)o.scrollTop=top;
}
function renderAll(){
 var a=document.activeElement,fk=a&&a.dataset?{act:a.dataset.act,arg:a.dataset.arg,id:a.id}:null,sy=window.scrollY;
 renderNav();
 var r=route(),f={board:vBoard,explore:vExplore,booth:vBooth,wrap:vWrap,teacher:vTeacher}[r];
 document.getElementById("app").innerHTML=f();
 if(locked()&&S.open!==null)S.open=null;
 renderLayer();
 window.scrollTo(0,sy);
 if(fk){var n=fk.id?document.getElementById(fk.id):fk.act?document.querySelector('[data-act="'+fk.act+'"]'+(fk.arg!=null?'[data-arg="'+fk.arg+'"]':"")):null;if(n)n.focus({preventScroll:true})}

/* ---------- 입력 ---------- */
var BAD=/시발|씨발|ㅅㅂ|병신|ㅄ|지랄|꺼져|닥쳐|멍청|바보|존나|개새/;
function addComment(){
 var b=BOOKS[S.open],nick=(S.draft.nick||"").trim(),text=(S.draft.text||"").trim();
 function m(c,t){S.msg.comment=[c,t];renderLayer()}
 if(!nick)return m("err","별칭을 적어 주세요.");
 if(!text)return m("err","내용을 적어 주세요.");
 if(BAD.test(nick+text))return m("err","친구가 읽고 기분 좋은 말로 바꿔 주세요.");
 if(isShare()&&NAMES.some(function(n){return (nick+text).indexOf(n)>=0}))return m("err","친구 이름은 빼고 적어 주세요.");
 if(Date.now()-S.lastCmt<10000)return m("err","10초 뒤에 다시 남길 수 있어요.");
 if(REMOTE){
  m("small","보내는 중이에요…");
  api({action:"comment",book:b.k,nick:nick,text:text,dev:devId()}).then(function(j){
   S.lastCmt=Date.now();S.draft.text="";m("ok",j.approved?"댓글을 남겼어요.":"보냈어요. 선생님이 확인하면 보여요.");net.sig="";pull();
  }).catch(function(e){m("err",netErr(e))});
  return;
 }
 db=load();db.comments.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),book:b.k,nick:nick,text:text,at:Date.now(),ok:!isShare()});
 save();S.lastCmt=Date.now();S.draft.text="";
 m("ok",isShare()?"보냈어요. 선생님이 확인하면 보여요.":"댓글을 남겼어요.");
}
function addPost(){
 var d=S.draft;function m(c,t){S.msg.post=[c,t];renderAll()}
 if(!d.pName)return m("err","이름을 골라 주세요.");
 if(!d.pB1||!d.pB2)return m("err","읽고 싶은 책 2권을 골라 주세요.");
 if(d.pB1===d.pB2)return m("err","서로 다른 책 2권을 골라 주세요.");
 var reason=(d.pReason||"").trim(),feel=(d.pFeel||"").trim();
 if(!reason)return m("err","읽고 싶어진 이유를 적어 주세요.");
 if(!feel)return m("err","프로젝트 소감을 적어 주세요.");
 if(BAD.test(reason+feel))return m("err","친구가 읽고 기분 좋은 말로 바꿔 주세요.");
 if(REMOTE){
  m("small","올리는 중이에요…");
  api({action:"post",name:d.pName,b1:d.pB1,b2:d.pB2,reason:reason,feel:feel,dev:devId(),pin:S.teacher?tPin():""}).then(function(){
   S.draft={};m("ok","게시했어요.");net.sig="";pull();
  }).catch(function(e){m("err",netErr(e))});
  return;
 }
 db=load();db.posts[d.pName]={name:d.pName,b1:d.pB1,b2:d.pB2,reason:reason,feel:feel,at:Date.now()};save();
 S.draft={};m("ok","게시했어요.");
}
function readCover(i,file){
 return new Promise(function(done){
  var r=new FileReader();
  r.onerror=function(){done("read")};
  r.onload=function(){var im=new Image();
   im.onload=function(){
    var w=360,h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
    var k=BOOKS[i].k;db=load();var before=bd(k).cover;bd(k).cover=c.toDataURL("image/jpeg",.78);
    if(!save()){if(before)bd(k).cover=before;else delete bd(k).cover;done("full")}else done("")};
   im.onerror=function(){done("read")};im.src=r.result};
  r.readAsDataURL(file)});
}
var COVER_ERR={read:"이미지를 읽지 못했어요. JPG나 PNG로 올려 주세요.",full:"저장 공간이 부족해요. 다른 표지를 지운 뒤 다시 올려 주세요."};
function fileCover(i,file){readCover(i,file).then(function(err){S.msg.book=COVER_ERR[err]||"";S.msg.bulk=null;renderAll()})}
function findBook(line){var n=line.normalize("NFC").replace(/\s/g,"");
 return BOOKS.filter(function(b){var p=presenter(b.k);return (p&&n.indexOf(p)>=0)||n.indexOf(b.k.replace(/\s/g,""))>=0||n.indexOf(b.t.replace(/\s/g,""))>=0})[0]}
function pasteLinks(text){
 var ok=0,miss=[];db=load();
 text.split(/\r?\n/).forEach(function(line){
  if(!line.trim())return;
  var urls=line.match(/https?:\/\/[^\s"'<>]+/g);if(!urls){miss.push(line.trim().slice(0,30));return}
  var b=findBook(line.replace(/https?:\/\/\S+/g,""));if(!b){miss.push(line.trim().slice(0,30));return}
  urls.forEach(function(u){if(/canva\.(com|link)/i.test(u))bd(b.k).canva=u;else bd(b.k).web=u});ok++});
 save();
 if(REMOTE&&ok){var items=BOOKS.filter(function(b){var x=db.books[b.k];return x&&(x.canva||x.web)}).map(function(b){var x=db.books[b.k];return {k:b.k,canva:x.canva||"",web:x.web||""}});
  api({action:"books",pin:tPin(),items:items}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.links=["err","시트에 저장하지 못했어요. "+netErr(e)];renderAll()})}
 S.msg.links=[miss.length?"err":"ok",ok+"권의 링크를 저장했어요."+(miss.length?" 책을 찾지 못한 줄: "+miss.join(" / "):"")];renderAll();
}
function matchCover(name){var n=String(name).normalize("NFC").replace(/\s/g,"");return BOOKS.filter(function(b){return n.indexOf(String(b.y))>=0||n.indexOf(b.k.replace(/\s/g,""))>=0})[0]}
function bulkCovers(files){
 var list=[].slice.call(files),ok=0,miss=[],fail=0;
 list.reduce(function(p,f){return p.then(function(){var b=matchCover(f.name);if(!b){miss.push(f.name);return}return readCover(b.i,f).then(function(e){if(e)fail++;else ok++})})},Promise.resolve()).then(function(){
  S.msg.book="";S.msg.bulk=[(miss.length||fail)?"err":"ok",ok+"권의 표지를 올렸어요."+(fail?" "+fail+"개는 읽거나 저장하지 못했어요.":"")+(miss.length?" 맞는 책을 찾지 못한 파일: "+miss.join(", "):"")];renderAll()});
}
function goTab(name){S.route=name;S.open=null;S.enter=true;try{history.replaceState(null,"","#"+name)}catch(x){}window.scrollTo(0,0);renderAll()}
document.addEventListener("click",function(e){
 var link=e.target.closest('a[href^="#"]');
 if(link){e.preventDefault();goTab(link.getAttribute("href").slice(1));return}
 var t=e.target.closest("[data-act]");if(!t)return;
 var act=t.dataset.act,arg=t.dataset.arg;
 if(act==="closeBg"){if(e.target.closest("[data-stop]"))return;S.open=null;S.msg.comment=null;renderLayer();return}
 switch(act){
  case"start":tStart();break;case"pause":tPause();break;
  case"next":tGo(db.timer.i+1);break;case"prev":tGo(db.timer.i-1);break;
  case"go":tGo(+arg);break;case"add":tAdd(+arg);break;case"reset":tReset();break;
  case"fs":var b=document.getElementById("boardWrap");if(b&&b.requestFullscreen)b.requestFullscreen().catch(function(){});if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){});unlockAudio();break;
  case"filter":S.filter=arg;renderAll();break;
  case"look":S.look=arg;renderAll();break;
  case"pasteLinks":var ta=document.getElementById("pasteL");if(ta)pasteLinks(ta.value);break;
  case"open":
   var doOpen=function(){S.open=+arg;S.msg.comment=null;S.justOpen=true;renderLayer();S.justOpen=false;var c=document.querySelector("#layer .close");if(c)c.focus()};
   var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
   if(t.classList.contains("spine")&&!calm){t.classList.add("pulling");setTimeout(function(){doOpen();t.classList.remove("pulling")},280)}else doOpen();
   break;
  case"close":S.open=null;S.msg.comment=null;renderLayer();break;
  case"rx":var k=BOOKS[S.open].k,m=my();m.rx=m.rx||{};m.rx[k]=m.rx[k]||{};var on=!m.rx[k][arg];m.rx[k][arg]=on;setMy(m);
   if(REMOTE){(function(k,kind,on){api({action:"react",book:k,kind:kind,on:on,dev:devId()}).catch(function(e){var mm=my();if(mm.rx&&mm.rx[k])mm.rx[k][kind]=!on;setMy(mm);S.msg.comment=["err","반응을 저장하지 못했어요. "+netErr(e)];renderLayer()})})(k,arg,on);renderLayer()}
   else{db=load();var rr=db.reactions[k]=db.reactions[k]||{};rr[arg]=Math.max(0,(rr[arg]||0)+(on?1:-1));save();renderLayer()}
   var nb=document.querySelector('[data-act="rx"][data-arg="'+arg+'"]');if(nb)nb.focus();break;
  case"zoom":S.zoom=+arg;renderLayer();break;
  case"zclose":S.zoom=null;renderLayer();break;
  case"zprev":S.zoom=Math.max(0,S.zoom-1);renderLayer();break;
  case"znext":S.zoom=Math.min(postList().length-1,S.zoom+1);renderLayer();break;
  case"logout":S.teacher=false;S.pin="";net.sig="";try{sessionStorage.removeItem("gojeon-t");sessionStorage.removeItem("gojeon-pin")}catch(x){}renderAll();break;
  case"cOk":if(REMOTE){api({action:"approve",pin:tPin(),id:arg}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.np=netErr(e);renderAll()});break}db=load();db.comments.forEach(function(c){if(c.id===arg)c.ok=true});save();renderAll();break;
  case"cDel":if(REMOTE){api({action:"delete",pin:tPin(),id:arg}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.np=netErr(e);renderAll()});break}db=load();db.comments=db.comments.filter(function(c){return c.id!==arg});save();renderAll();break;
  case"covDel":db=load();delete bd(BOOKS[+arg].k).cover;save();renderAll();break;
  case"wipe":if(!S.wipe){S.wipe=true;renderAll();break}S.wipe=false;if(REMOTE)api({action:"wipe",pin:tPin()}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.np=netErr(e);renderAll()});db=load();db.comments=[];db.reactions={};db.posts={};db.notes={};save();setMy(Object.assign(my(),{rx:{}}));renderAll();break;
  case"export":var keep=JSON.parse(JSON.stringify(db));var blob=new Blob([JSON.stringify(keep)],{type:"application/json"});var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="고전독서박람회-백업.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);break;
 }
});
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.dataset.input){if(t.dataset.input==="q"){S.q=t.value;var pos=t.selectionStart;renderAll();var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(pos,pos)}}else S.draft[t.dataset.input]=t.value}

document.addEventListener("change",function(e){
 var t=e.target;
 if(t.dataset.actChange==="me"){var m=my();m.me=t.value;setMy(m);renderAll();return}
 if(t.dataset.note!=null){var me=my().me;if(!me)return;db=load();var n=db.notes[me]=db.notes[me]||[];n[+t.dataset.note]=t.value.slice(0,80);save();return}
 if(t.dataset.set){db=load();if(t.dataset.set==="share"){db.settings.mode=t.checked?"share":"class";if(REMOTE)api({action:"mode",pin:tPin(),mode:db.settings.mode}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.np="공유 모드를 저장하지 못했어요. "+netErr(e);renderAll()})}else db.settings[t.dataset.set]=t.checked;save();renderAll();return}
 if(t.dataset.book!=null){db=load();var bk=BOOKS[+t.dataset.book].k,fk=t.dataset.key,fv=t.value.trim();bd(bk)[fk]=fv;save();
  if(REMOTE){S.msg.book="저장하는 중이에요…";api({action:"book",pin:tPin(),k:bk,f:fk,v:fv}).then(function(){S.msg.book="";net.sig="";pull();renderAll()}).catch(function(e){S.msg.book=BOOKS[+t.dataset.book].t+" 저장 실패: "+netErr(e);renderAll()})}
  renderAll();return}

});
document.addEventListener("submit",function(e){
 e.preventDefault();
 var f=e.target.dataset.form;
 if(f==="comment")addComment();
 else if(f==="post")addPost();
 else if(f==="pin"&&REMOTE){var pv=document.getElementById("pin").value;S.msg.pin="확인하는 중이에요…";renderAll();
  api({action:"login",pin:pv}).then(function(){S.teacher=true;S.pin=pv;S.msg.pin="";try{sessionStorage.setItem("gojeon-t","1");sessionStorage.setItem("gojeon-pin",pv)}catch(x){}net.sig="";pull();renderAll()})
  .catch(function(e){S.msg.pin=netErr(e);renderAll()})}
 else if(f==="newpin"&&REMOTE){var nv=document.getElementById("np").value.trim();if(nv.length<4){S.msg.np="4자리 이상으로 적어 주세요.";renderAll();return}
  api({action:"setpin",pin:tPin(),newpin:nv}).then(function(){S.pin=nv;try{sessionStorage.setItem("gojeon-pin",nv)}catch(x){}S.msg.np="PIN을 바꿨어요."}).catch(function(e){S.msg.np=netErr(e)}).then(renderAll)}
 else if(f==="pin"){if(document.getElementById("pin").value===db.settings.pin){S.teacher=true;S.msg.pin="";try{sessionStorage.setItem("gojeon-t","1")}catch(x){}}else S.msg.pin="PIN이 맞지 않아요.";renderAll()}
 else if(f==="newpin"){var v=document.getElementById("np").value.trim();if(v.length>=4){db=load();db.settings.pin=v;save();S.msg.np="PIN을 바꿨어요."}else S.msg.np="4자리 이상으로 적어 주세요.";renderAll()}
});
document.addEventListener("keydown",function(e){
 if(S.zoom!==null){if(e.key==="Escape"){S.zoom=null;renderLayer()}if(e.key==="ArrowLeft"){S.zoom=Math.max(0,S.zoom-1);renderLayer()}if(e.key==="ArrowRight"){S.zoom=Math.min(postList().length-1,S.zoom+1);renderLayer()}return}
 if(S.open!==null&&e.key==="Escape"){S.open=null;renderLayer()}
});
document.addEventListener("focusout",function(){setTimeout(function(){if(S.dirty&&!inField())renderAll()},0)});
window.addEventListener("hashchange",function(){S.route=(location.hash||"").slice(1);window.scrollTo(0,0);S.open=null;S.enter=true;renderAll()});
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&t.dataset.y)t.remove()},true);
window.addEventListener("storage",function(e){if(e.key!==KEY)return;db=load();if(inField())S.dirty=true;else renderAll()});
renderAll();setInterval(tick,250);
if(REMOTE){pull();setInterval(function(){if(!document.hidden)pull()},8000);document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()})}
