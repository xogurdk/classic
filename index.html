<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고전독서 박람회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9eff0;--paper:#fbfdfc;--ink:#14272b;--muted:#51666b;--line:#c3d0d2;--soft:#dcebec;
  --accent:#0b5c6b;--on-accent:#fff;--stamp:#b3261e;--notice:#fff2c9;--notice-ink:#574300;
  --board:#0d1f24;--board-2:#183239;--board-ink:#f1f7f6;--board-muted:#9fb8bb;--board-hot:#ffb74d;--board-over:#ff8a80;
  --wood:#a06b3c;--wood-2:#6e4526;
  --display:"Do Hyeon","Gowun Dodum","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10191c;--paper:#1a262a;--ink:#e6f0f0;--muted:#a0b3b6;--line:#34464b;--soft:#24363b;
  --accent:#6cc5d4;--on-accent:#06262c;--stamp:#ff9d94;--notice:#3b3210;--notice-ink:#f5e2a0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.brand{font:400 1.25rem var(--display);color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tab{color:var(--muted);text-decoration:none;font:400 1.05rem/1.2 var(--display);padding:8px 12px;border-radius:8px;min-height:40px;display:inline-flex;align-items:center}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tab.quiet{font-size:.95rem;margin-left:auto}
.view{max-width:1240px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:18px}
.lede{color:var(--muted)}
.h1{font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1.2}
.h2{font-size:1.4rem}
.btn{font:400 1.02rem var(--display);min-height:44px;padding:7px 15px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled,.btn.off{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lab{font:400 1rem var(--display)}
input[type=text],input[type=url],input[type=password],input[type=search],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%;max-width:100%}
textarea{min-height:76px;resize:vertical}
.err{color:var(--stamp);font-size:.94rem}
.ok{color:var(--accent);font-size:.94rem}
.small{font-size:.87rem;color:var(--muted)}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.notice{background:var(--notice);color:var(--notice-ink);padding:10px 14px;border-radius:8px}
.tablebox{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font:400 .95rem var(--display);color:var(--muted)}
td.code{color:var(--stamp);font-family:var(--display)}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
tr.on td{background:var(--soft)}
td.nowcol,th.nowcol{background:var(--notice);color:var(--notice-ink)}
.free{color:var(--muted)}

/* 전자칠판 */
.bwrap{background:var(--board);color:var(--board-ink);min-height:calc(100vh - 58px);padding:clamp(14px,2.5vw,32px);display:grid;grid-template-rows:auto 1fr auto;gap:clamp(10px,2vh,24px)}
.bwrap:fullscreen{min-height:100vh}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;align-items:baseline}
.bphase{font:400 clamp(1.2rem,2.4vw,2rem) var(--display);color:var(--board-muted)}
.bclock{font:500 clamp(1.3rem,3vw,2.6rem) var(--mono);font-variant-numeric:tabular-nums}
.bclock small{font:400 clamp(.9rem,1.5vw,1.2rem) var(--body);color:var(--board-muted);margin-left:10px}
.bmain{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(6px,1.6vh,18px);min-width:0}
.btime{font:500 min(15vw,34vh)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap}
.btime.hot{color:var(--board-hot)}.btime.over{color:var(--board-over)}.btime.paused{opacity:.55}
.btitle{font:400 clamp(1.6rem,3.6vw,3.2rem)/1.2 var(--display);word-break:keep-all}
.btitle.sm{font-size:clamp(1.2rem,2.4vw,2rem);color:var(--board-muted)}
.bmsg{font:400 clamp(2.2rem,5.6vw,5.4rem)/1.3 var(--display);white-space:pre-line;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;max-width:min(100%,20em)}
.btodo{font-size:clamp(1.3rem,2.8vw,2.5rem);line-height:1.35;white-space:pre-line;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;max-width:min(100%,24em)}
.bnext{font-size:clamp(1rem,1.6vw,1.35rem);color:var(--board-muted);margin-top:6px}
.strip{display:flex;gap:3px}
.seg{min-width:0;padding-top:8px;border-top:8px solid var(--board-2);font-size:clamp(.72rem,1.15vw,1rem);color:var(--board-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.done{border-top-color:var(--board-muted)}
.seg.now{border-top-color:var(--board-hot);color:var(--board-ink)}
.bctl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.bbtn{font:400 1rem var(--display);min-height:42px;padding:5px 13px;border:1.5px solid var(--board-muted);border-radius:8px;background:transparent;color:var(--board-ink);cursor:pointer}
.bbtn.main{background:var(--board-hot);border-color:var(--board-hot);color:#2b1a00}
@media (max-width:760px){.btime{font-size:24vw}.seg{font-size:0;padding-top:4px}}
.bsplit{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(0,1.6fr);gap:clamp(12px,2.2vw,36px);align-items:center;width:100%;text-align:center}
.bleft{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,16px);min-width:0}
.bsplit .btime{font-size:min(10vw,21vh)}
.bsplit .btodo{font-size:clamp(1.05rem,1.7vw,1.7rem)}
.bright{display:grid;gap:clamp(6px,1vh,12px);min-width:0;text-align:left}
.bmaptitle{font:400 clamp(1.1rem,1.9vw,1.9rem) var(--display);color:var(--board-hot)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{background:var(--board-2);border-radius:8px;padding:2px 10px;font-size:clamp(.85rem,1.2vw,1.2rem)}
.bchip b{font-weight:400;font-family:var(--display);color:var(--board-hot);margin-left:6px}
@media (max-width:900px){.bsplit{grid-template-columns:minmax(0,1fr)}}

/* 책 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px 14px}
.bk{all:unset;cursor:pointer;display:grid;gap:6px;align-content:start;min-width:0}
.bk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bk:hover .cover{transform:translateY(-3px)}
.bk-title{font:400 1.08rem/1.25 var(--display)}
.bk-tag{font-size:.82rem;color:var(--muted)}
.cover{aspect-ratio:2/3;border-radius:3px 8px 8px 3px;overflow:hidden;position:relative;box-shadow:inset 7px 0 0 rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.2);transition:transform .15s;width:100%;max-width:100%;container-type:inline-size}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--paper)}
.cv{position:absolute;inset:0;padding:11cqw 9cqw 8cqw 14cqw;display:flex;flex-direction:column;background:var(--c1);color:var(--c2)}
.cv::before{content:"";position:absolute;inset:auto 0 0 0;height:42%;opacity:.4}
.p0 .cv::before{background:repeating-linear-gradient(135deg,var(--c2) 0 2cqw,transparent 2cqw 7cqw)}
.p1 .cv::before{background:radial-gradient(circle,var(--c2) 1.6cqw,transparent 1.8cqw) 0 0/9cqw 9cqw}
.p2 .cv::before{background:repeating-radial-gradient(circle at 80% 100%,var(--c2) 0 1.5cqw,transparent 1.5cqw 7cqw)}
.p3 .cv::before{background:repeating-linear-gradient(0deg,var(--c2) 0 1.5cqw,transparent 1.5cqw 6cqw)}
.cv b{font:400 12.5cqw/1.15 var(--display);position:relative;word-break:keep-all}
.cv i{font:normal 6.4cqw/1.3 var(--body);margin-top:5cqw;position:relative;opacity:.9}
.cv u{text-decoration:none;font-size:6cqw;margin-top:auto;position:relative;background:var(--c1);padding:1cqw 2cqw;align-self:flex-start}

/* 책장 */
.shelf{display:grid;gap:0}
.plate{justify-self:start;background:var(--wood-2);color:#f6e9d4;font-size:1.08rem;padding:3px 14px;border-radius:6px 6px 0 0}
.rowbox{overflow-x:auto;overflow-y:hidden;background:linear-gradient(#2c2019,#3d2c20);padding-top:26px;scrollbar-width:thin}
.shelfrow{display:flex;align-items:flex-end;gap:3px;height:310px;width:max-content;min-width:100%;padding:0 16px;justify-content:center}
.plank{height:16px;background:linear-gradient(var(--wood),var(--wood-2));box-shadow:0 6px 10px rgba(0,0,0,.28);border-radius:0 0 3px 3px}
.end{align-self:flex-end;height:66%;writing-mode:vertical-rl;background:#e9dcc6;color:#3c2a1c;font:400 .86rem var(--display);padding:10px 6px;margin:0 7px;border-radius:3px 3px 0 0;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.spine{position:relative;flex:none;width:var(--w);height:var(--h);padding:0;border:0;background:none;cursor:pointer;color:var(--c2);transition:transform .2s ease;transform-origin:bottom center}
.spine:focus-visible{outline:3px solid #ffd76e;outline-offset:1px}
.sp{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.26),transparent 14%,transparent 84%,rgba(0,0,0,.3)),var(--c1);border-radius:3px 3px 0 0;writing-mode:vertical-rl;display:flex;flex-direction:column;gap:2px;align-items:flex-start;justify-content:flex-start;padding:14px 4px 10px;overflow:hidden;text-align:left}
.sp b{font:400 1.08rem/1.15 var(--display)}
.sp i{font:normal .72rem/1.1 var(--body);opacity:.85;margin-top:auto}
.pop{position:absolute;left:0;bottom:6px;width:172px;z-index:3;pointer-events:none;opacity:0;visibility:hidden;transform:perspective(700px) rotateY(-68deg) translateX(-8px);transform-origin:left center;transition:transform .28s ease,opacity .18s ease,visibility 0s linear .28s}
.pop .cover{box-shadow:0 12px 26px rgba(0,0,0,.55)}
.pr .pop{left:auto;right:0;transform-origin:right center;transform:perspective(700px) rotateY(68deg) translateX(8px)}
@media (hover:hover){
 .spine:hover{transform:translateY(-14px);z-index:4}
 .spine:hover .pop{opacity:1;visibility:visible;transform:none;transition:transform .28s ease,opacity .18s ease}
}
.spine:focus-visible{transform:translateY(-14px);z-index:4}
.spine:focus-visible .pop{opacity:1;visibility:visible;transform:none}
.spine.pulling{transform:translateY(-22px) scale(1.07);z-index:5}
.enter .spine{animation:shelve .42s cubic-bezier(.2,.8,.25,1) backwards;animation-delay:var(--d)}
@keyframes shelve{from{transform:translateY(-34px) rotate(3deg);opacity:0}}
.dialog.opening{animation:bookOpen .3s ease;transform-origin:left center}
@keyframes bookOpen{from{transform:perspective(1200px) rotateY(-24deg) scale(.94);opacity:0}}
@media (hover:none){.pop{display:none}}
@media (prefers-reduced-motion:reduce){.enter .spine,.dialog.opening{animation:none}.pop{transform:none}}
/* 상세·확대 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,18,22,.72);display:grid;place-items:start center;overflow:auto;padding:24px 16px}
.dialog{background:var(--paper);border-radius:14px;padding:20px;width:100%;max-width:880px;display:grid;gap:16px;min-width:0}
.d-top{display:grid;grid-template-columns:190px minmax(0,1fr) 130px;gap:20px}
.d-top .cover{max-width:190px}
.d-info{display:grid;gap:8px;align-content:start;min-width:0}
.close{justify-self:end}
.rx{display:flex;flex-wrap:wrap;gap:8px}
.rxb{font:inherit;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.rxb[aria-pressed="true"]{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.clist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.clist li{border-bottom:1px solid var(--line);padding-bottom:8px;overflow-wrap:anywhere}
.nick{font:400 .98rem var(--display);color:var(--accent)}
.rxb .cnt{display:inline-block;min-width:1.7em;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--soft);font:500 .92rem var(--mono);font-variant-numeric:tabular-nums;text-align:center}
.rxb[aria-pressed="true"] .cnt{background:var(--stamp);color:var(--paper)}
.rxb.bump .cnt{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.35)}}
/* 이름 */
.mechip{display:flex;align-items:center;gap:6px;font:400 1rem var(--display);color:var(--ink)}
.mechip .btn{min-height:34px}
.mechip:empty{display:none}

/* 배치도 */
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px}
.mapbox{display:grid;gap:8px;min-width:0;align-content:start}
.mapwrap{container-type:inline-size;min-width:0}
.mapwrap .seat .cover{display:none}
.mapwrap .seat{grid-template-columns:minmax(0,1fr)}
@container (min-width:860px){.mapwrap .seat .cover{display:block}.mapwrap .seat{grid-template-columns:auto minmax(0,1fr)}}
.map{--pc:44px;display:grid;grid-template-columns:var(--pc) repeat(5,minmax(0,1fr)) var(--pc);gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.m-back{grid-column:1/-1;grid-row:1;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px dashed var(--line);padding-bottom:6px;color:var(--muted);font:400 .98rem var(--display)}
.m-door{background:var(--soft);color:var(--ink);padding:2px 9px;border-radius:6px;font-size:.88rem}
.m-board{grid-column:1/-1;grid-row:7;background:#1f4a3a;color:#eaf5ec;text-align:center;border-radius:6px;padding:6px;font:400 1.05rem var(--display);letter-spacing:.3em;margin-top:2px}
.m-floor{grid-column:3/6;grid-row:2/5;border:2px dotted var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.86rem;padding:8px;word-break:keep-all}
.seat{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-width:0;min-height:92px;background:#f3e6cf;color:#2f2115;border:2px solid #c9a676;border-radius:6px;padding:6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:center;transition:transform .15s}
.seat:hover{transform:translateY(-2px)}
.seat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seat .cover{width:44px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.s-txt{display:grid;gap:2px;min-width:0}
.s-code{font:400 .95rem var(--display);color:#9a2d1f;white-space:nowrap}
.s-t{font:400 1rem/1.2 var(--display);word-break:keep-all;overflow-wrap:anywhere}
.s-badge{justify-self:start;white-space:nowrap;font-size:.74rem;background:#9a2d1f;color:#fff;border-radius:999px;padding:0 7px}
.seat.mine{box-shadow:0 0 0 3px var(--stamp)}
.seat.tour{box-shadow:0 0 0 3px var(--accent)}
.seat.dim{opacity:.35}
.seat.off{cursor:default;background:transparent;border:2px dashed var(--line);color:var(--muted);display:flex;justify-content:center;text-align:center;font-size:.86rem}
.seat.off:hover{transform:none}
.pc{align-self:center;justify-self:center;position:relative;width:var(--pc);height:var(--pc);border-radius:50%;border:2px solid var(--accent);background:var(--paper);color:var(--accent);display:flex;align-items:center;justify-content:center;font:400 .8rem/1 var(--display);text-align:center;word-break:keep-all;padding:2px}
.pc::after{content:"";position:absolute;border:6px solid transparent}
.pc.fl::after{left:-13px;border-right-color:var(--accent)}
.pc.fr::after{right:-13px;border-left-color:var(--accent)}
.pc.fu::after{top:-13px;border-bottom-color:var(--accent)}
.pc.off{border-style:dashed;border-color:var(--line)}
.pc.off::after{display:none}
.map{color:var(--ink)}
.s-ls{font:400 .9rem/1.25 var(--display);color:var(--accent);word-break:keep-all}
.s-ls.free{color:#8a7a66}
.seat.hl{box-shadow:0 0 0 4px var(--stamp);animation:hl 1.2s ease-in-out infinite alternate}
@keyframes hl{to{box-shadow:0 0 0 7px var(--stamp)}}
.map.big{--pc:clamp(40px,4vw,62px);gap:clamp(5px,.8vw,10px)}
.map.big .cover{display:none}
.map.big .seat{grid-template-columns:minmax(0,1fr);min-height:clamp(70px,10vh,120px);align-content:center}
.map.big .s-code{font-size:clamp(.9rem,1.3vw,1.3rem)}
.map.big .s-t{font-size:clamp(.95rem,1.4vw,1.45rem)}
.map.big .s-ls{font-size:clamp(1rem,1.55vw,1.6rem)}
.map.big .pc{font-size:clamp(.75rem,1.05vw,1.05rem)}
.map.big .m-floor{font-size:clamp(.8rem,1.1vw,1.1rem)}
@media (prefers-reduced-motion:reduce){.seat.hl{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.86rem;color:var(--muted)}
.legend b{font-weight:400;font-family:var(--display);color:var(--ink)}
@media (max-width:600px){.map{--pc:38px;gap:5px;padding:8px}.seat{grid-template-columns:minmax(0,1fr);min-height:84px;padding:5px}.seat .cover{display:none}.s-t{font-size:.86rem}.s-code{font-size:.84rem}.pc{font-size:.7rem}.m-floor{font-size:.76rem}}
@media (max-width:620px){.d-top{grid-template-columns:minmax(0,1fr)}.d-top .cover{max-width:150px}.d-badge{grid-template-columns:96px minmax(0,1fr);justify-items:start;text-align:left;align-items:center}.d-badge .bdg{max-width:96px}}

/* 포스터 */
.poverlay{position:fixed;inset:0;z-index:25;background:rgba(5,14,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:auto;animation:pfade .35s ease}
@keyframes pfade{from{background:rgba(5,14,18,0)}}
.pstage{perspective:1600px}
.pflip{position:relative;height:min(calc(100dvh - 170px),calc(92vw * 1.414),980px);aspect-ratio:1414/2000;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1);cursor:pointer;border:0;padding:0;background:none;display:block}
.pflip.back{transform:rotateY(180deg)}
.pface{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.pface.b{transform:rotateY(180deg)}
.pcap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;color:#f1f7f6;text-align:center;animation:pup .5s .25s ease backwards}
.pcap .t{font:400 1.25rem var(--display);width:100%}
@keyframes pup{from{opacity:0;transform:translateY(14px)}}
.pcap .btn.ghost{color:#f1f7f6;border-color:#9fb8bb}
.poverlay.leaving{animation:pout .28s ease forwards}
@keyframes pout{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.poverlay,.pcap{animation:none}.pflip{transition:none}}

/* 뱃지 */
.bdg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.28))}

.bcell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;justify-items:center;text-align:center;padding:10px 6px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line)}

.bcell .bdg{max-width:104px;aspect-ratio:1;object-fit:contain}

.bcell{perspective:700px}
.bcell .bdg{backface-visibility:visible}

var BADGE_MIN=30;
function badgeSrc(b){return "badges/"+(POSTER[b.k]||["champion"])[0]+".webp"}
var CHAMP_SRC="badges/champion.webp";
function chars(t){return String(t||"").replace(/\s/g,"").length}
function hasBadge(k,name){name=name||uname();if(!name)return false;if(presenter(k)===name)return true;
 if(name===uname())return chars(getExpect(k))>=BADGE_MIN;var L=allBadges()[name]||[];return L.indexOf(k)>=0}
function badgeCount(name){return BOOKS.filter(function(b){return hasBadge(b.k,name)}).length}
function isChamp(name){return badgeCount(name)===BOOKS.length}
function allBadges(){
 var out={};
 if(REMOTE&&db.badgesAll){Object.keys(db.badgesAll).forEach(function(n){out[n]=db.badgesAll[n].slice()})}
 else Object.keys(db.users||{}).forEach(function(n){var ex=db.users[n].expect||{};out[n]=Object.keys(ex).filter(function(k){return chars(ex[k].t)>=BADGE_MIN})});
 var me=uname();if(me){out[me]=BOOKS.filter(function(b){return chars(getExpect(b.k))>=BADGE_MIN}).map(function(b){return b.k})}
 return out;
}
function badgeBox(b,cls){
 var got=hasBadge(b.k),mine=presenter(b.k)===uname()&&!!uname();
 return '<div class="'+cls+'"><img class="bdg'+(got?"":" off")+'" src="'+badgeSrc(b)+'" alt="'+esc(b.t)+' 뱃지'+(got?"":" (아직 못 받음)")+'"><span>'+(got?'<b>'+(mine?"내 발표 뱃지":"뱃지 획득!")+'</b>':'기대평을 공백 빼고 '+BADGE_MIN+'자 이상 올리면 받아요')+'</span></div>';

var KEY="gojeon-fair-v1",MYKEY="gojeon-fair-my";
function fresh(){return{timer:{i:0,running:false,endsAt:0,remain:STEPS[0].sec},settings:{mode:"class",lock:true,pin:"1234",sound:true},books:{},reactions:{},comments:[],posts:{},notes:{},users:{}}}
var memoryOnly=false,memMy={};
function load(){var fallback=db||fresh();try{var raw=localStorage.getItem(KEY);if(!raw)return fallback;var d=JSON.parse(raw);if(d&&d.timer&&d.settings)return d;return fallback}catch(e){memoryOnly=true;return fallback}}
var db=null;db=load();if(!STEPS[db.timer.i])db.timer=fresh().timer;

/* ---------- 이름으로 들어가기: 반응·메모·소감·댓글은 모두 이 이름으로 저장돼요 ---------- */
function uname(){return my().name||(S.teacher?"선생님":"")}
function inRoster(n){return NAMES.indexOf(n)>=0}
function urec(n){db.users=db.users||{};return db.users[n]||(db.users[n]={rx:{},first:Date.now()})}
function myRx(){var n=uname();return n&&db.users&&db.users[n]?db.users[n].rx||{}:{}}
function getExpect(k){var u=db.users&&db.users[uname()];return u&&u.expect&&u.expect[k]?u.expect[k].t||"":""}
function setExpect(k,text,push){var n=uname();if(!n)return;db=load();var u=urec(n);u.expect=u.expect||{};u.expect[k]={t:String(text).slice(0,200),at:nowMs()};save();
 if(push&&REMOTE)api({action:"expect",name:n,book:k,text:u.expect[k].t}).catch(function(){})}
function exDraft(k){var d=S.draft["ex:"+k];return d!=null?d:getExpect(k)}
function exCount(k){var n=chars(exDraft(k));return '<span class="small excount'+(n>=BADGE_MIN?" ok":"")+'" data-excount="'+esc(k)+'">공백 빼고 '+n+' / '+BADGE_MIN+'자'+(n>=BADGE_MIN?" ✓":"")+'</span>'}
function expectHtml(b,id){
 var m=S.msg["ex:"+b.k],saved=getExpect(b.k);
 return '<form class="field exform" data-form="expect" data-k="'+esc(b.k)+'"><label class="lab" for="'+id+'">기대평 · 이 책에서 기대되는 부분</label>'

/* 기대평 = 댓글: 책마다 모두의 기대평이 작성자와 함께 남아요 */
function expectsFor(k){
 var me=uname(),L=expectList().filter(function(x){return x.book===k&&x.text&&x.name!==me});
 var mine=getExpect(k);if(me&&mine){var u=db.users[me]||{},ex=(u.expect||{})[k]||{};L.push({name:me,book:k,text:mine,at:ex.at||0})}
 return L.sort(function(a,b){return (b.at||0)-(a.at||0)});
}

function expectListHtml(b){
 var L=expectsFor(b.k),me=uname();
 return '<div class="field"><span class="lab">기대평 <span class="small">'+L.length+'개</span></span>'
 +(L.length?'<ul class="clist">'+L.map(function(x){var mine=x.name===me;return '<li><span class="nick">'+esc(dispName(x.name))+(mine?' <span class="small">(나)</span>':'')+'</span> '+esc(x.text)

function delExpect(name,k){
 function after(){if(S.open!==null)renderLayer();else renderAll()}
 if(name===uname()){setExpect(k,"",true);delete S.draft["ex:"+k];S.msg["ex:"+k]=["ok","내 기대평을 지웠어요."];after();return}
 db=load();if(db.users&&db.users[name]&&db.users[name].expect)delete db.users[name].expect[k];
 if(db.expects)db.expects=db.expects.filter(function(x){return !(x.name===name&&x.book===k)});save();after();
 if(REMOTE)api({action:"unexpect",pin:tPin(),name:name,book:k}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.np="기대평을 지우지 못했어요. "+netErr(e);renderAll()});
}
function submitExpect(k){
 var text=String(exDraft(k)).trim(),key="ex:"+k;
 function done(c,t){S.msg[key]=[c,t];if(S.open!==null)renderLayer();else renderAll()}
 if(!uname())return done("err","이름을 적고 들어와야 올릴 수 있어요.");
 if(!text)return done("err","기대평을 적어 주세요.");
 if(BAD.test(text))return done("err","친구가 읽고 기분 좋은 말로 바꿔 주세요.");
 var had=hasBadge(k),wasChamp=isChamp(uname());
 setExpect(k,text,true);delete S.draft[key];
 if(!had&&hasBadge(k)){S.msg[key]=["ok","기대평을 올렸어요."];showAward(k,!wasChamp&&isChamp(uname()));if(S.open!==null)renderLayer();else{renderAll()}return}
 done("ok",chars(text)>=BADGE_MIN?"기대평을 고쳤어요.":"올렸어요. 공백 빼고 "+BADGE_MIN+"자 이상이면 뱃지를 받아요 (지금 "+chars(text)+"자).");
}
/* 뱃지 받기 화면 */
function showAward(k,champ){S.award={k:k,champ:!!champ,stage:k?"book":"champ"};chime(champ);}
function chime(big){try{unlockAudio();if(!audio)return;var f=big?[523,659,784,1047,1319]:[659,784,1047];f.forEach(function(fr,n){var o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=fr;o.connect(g);g.connect(audio.destination);var at=audio.currentTime+n*.12;g.gain.setValueAtTime(.18,at);g.gain.exponentialRampToValueAtTime(.001,at+.5);o.start(at);o.stop(at+.52)})}catch(e){}}
function vAward(){
 var a=S.award,champ=a.stage==="champ",b=champ?null:byK[a.k],src=champ?CHAMP_SRC:badgeSrc(b),n=badgeCount(uname());
 var cols=["#ffd76e","#ff8a80","#80deea","#a5d6a7","#ce93d8","#fff","#ffb74d"],cf="";
 for(var i=0;i<(champ?60:36);i++){var ang=Math.random()*Math.PI*2,dist=(champ?260:180)+Math.random()*260;cf+='<i class="cf" style="--c:'+cols[i%cols.length]+';--x:'+Math.round(Math.cos(ang)*dist)+'px;--y:'+Math.round(Math.sin(ang)*dist)+'px;--r:'+Math.round(Math.random()*720-360)+'deg;--d:'+(0.45+Math.random()*.35).toFixed(2)+'s"></i>'}

 +'<div class="aw-badge'+(champ?" big":"")+'" style="--m:url('+src+')"><img src="'+src+'" alt="'+(champ?"고전 챔피언":esc(b.t))+' 뱃지"></div>'

 +'<div class="row">'+(a.champ&&!champ?'<button class="btn" data-act="awnext">다음 →</button>':'<button class="btn" data-act="awhall">명예의 전당 보기</button><button class="btn ghost" data-act="awclose">계속하기</button>')+'</div></div>';
}

function vHall(){
 var me=uname(),n=badgeCount(me),ch=isChamp(me),share=isShare();
 var cells=BOOKS.map(function(b){var got=hasBadge(b.k),mine=presenter(b.k)===me;
  return '<button class="bcell'+(got?" got":"")+'" data-act="open" data-arg="'+b.i+'"><img class="bdg'+(got?"":" off")+'" src="'+badgeSrc(b)+'" alt="'+esc(b.t)+' 뱃지'+(got?"":" (아직 못 받음)")+'" loading="lazy"><span class="t">'+esc(b.t)+'</span><span class="st">'+(got?(mine?"내 발표 뱃지":"획득"):"기대평 쓰고 받기")+'</span></button>'}).join("");
 var all=allBadges(),names=Object.keys(all);
 Object.keys(V1).concat(Object.keys(V2)).forEach(function(x){if(names.indexOf(x)<0)names.push(x)});

 return '<section class="panel"><div class="fb-top">'+coverHtml(b)+'<div class="d-info"><span class="small">'+o.label+'</span><h2 class="h1">'+esc(b.t)+'</h2><p class="small">'+esc(b.a)+' · '+esc(b.p)+'</p>'
 +(o.who?'<p>'+o.code+' 부스 · 발표 <b>'+esc(o.who)+'</b></p>':'')
 +'<div class="row">'+(c?'<a class="btn" href="'+esc(c)+'" target="_blank" rel="noopener noreferrer">'+(o.mine?"내 발표 자료 열기":"발표 자료 보기")+'</a>':'<button class="btn off" disabled>링크 등록 전이에요</button>')+(w?'<a class="btn ghost" href="'+esc(w)+'" target="_blank" rel="noopener noreferrer">웹앱 열기</a>':'')+(posters(b).length?'<button class="btn ghost" data-act="poster" data-arg="'+b.i+'">포스터 보기</button>':'')+'</div>'
 +(o.extra||'')+'</div>'+badgeBox(b,"f-badge")+'</div>'+(o.review?rxHtml(b)+expectListHtml(b)+expectHtml(b,"exf"+b.i):o.mine?expectListHtml(b):'')+'</section>';
}
/* 소개 시간: 발표자는 내 발표 자료, 듣는 사람은 지금 회차 발표 자료만 보여요. 3분이 지나면 다음 부스 안내 */
function vFocus(){
 var s=step(),part=s.talk,me=uname(),role=roleOf(part,me);
 if(!role)return vLocked("이 화면");
 var over=s.kind==="move"||remain()<=0,r=s.round,nr=over?r+1:r;
 var bar='<div class="fbar"><span>'+part+'부 소개 · '+(over?(nr<=3?r+'회차 끝 · '+nr+'회차로 이동':'소개가 모두 끝났어요'):r+'회차 '+(role.pres?'내 발표':'듣는 중'))+'</span><span class="ftime" data-timer>'+fmt(remain())+'</span></div>';
 var body="";
 if(role.pres){
  var mb=byK[role.row[1]],code=seatCode(role.row[0]);
  if(!over){
   var ls=listenersAt(part,mb.k,r);
   body='<h1 class="h1">지금은 내가 발표하는 시간이에요</h1>'+bookPanel(mb,{label:code+' 부스 · 내 발표',mine:true,extra:'<p class="names">이번에 듣는 친구: '+(ls.length?esc(ls.join(", ")):'선생님·참관자')+'</p>'});
  }else if(nr<=3){
   var nl=listenersAt(part,mb.k,nr);
   body='<div class="fnext"><span class="small">'+r+'회차 발표 끝! 잘했어요</span><span class="ttl">'+nr+'회차에 올 친구</span><span class="big">'+(nl.length?esc(nl.join(", ")):'선생님·참관자')+'</span><span class="small">자리를 지키고 다음 발표를 준비해요</span></div>'
   +bookPanel(mb,{label:code+' 부스 · 내 발표',mine:true});
  }else if(part===1){
   var k1=V1[me][0],r1=rowOf(2,k1);
   body='<div class="fnext"><span class="small">1부 발표가 모두 끝났어요. 수고했어요!</span><span class="ttl">이제 2부 소개를 들으러 가요 · 1회차</span><span class="big">'+seatCode(r1[0])+'</span><span class="ttl">'+esc(byK[k1].t)+'</span><span class="small">발표 '+esc(r1[2])+'</span></div>'+mapSection(2,{me:me,hl:k1,static:true});
  }else body='<div class="fnext"><span class="ttl">2부 발표가 모두 끝났어요. 수고했어요!</span><span class="small">선생님 안내에 따라 읽고 싶은 책을 고르고 소감을 써요</span></div>';
 }else{
  var k=role.tour[r-1],row=rowOf(part,k),b=byK[k];
  if(!over){
   body=bookPanel(b,{label:r+'회차 · 지금 듣는 책',who:row[2],code:seatCode(row[0]),review:true});
  }else{
   var head="";
   if(nr<=3){var nk=role.tour[nr-1],nrow=rowOf(part,nk);
    head='<div class="fnext"><span class="small">다음 부스로 이동해요 · '+nr+'회차</span><span class="big">'+seatCode(nrow[0])+'</span><span class="ttl">'+esc(byK[nk].t)+'</span><span class="small">발표 '+esc(nrow[2])+'</span></div>';
    body=head+bookPanel(b,{label:'방금 들은 책 · 후기를 남겨요',who:row[2],code:seatCode(row[0]),review:true})+mapSection(part,{me:me,hl:nk,static:true});
   }else if(part===1){var mine=P2.filter(function(x){return x[2]===me})[0];
    head='<div class="fnext"><span class="small">1부 소개가 모두 끝났어요</span><span class="ttl">이제 내가 발표할 차례예요. 내 부스로 가요</span><span class="big">'+seatCode(mine[0])+'</span><span class="ttl">'+esc(byK[mine[1]].t)+'</span></div>';
    body=head+bookPanel(b,{label:'방금 들은 책 · 후기를 남겨요',who:row[2],code:seatCode(row[0]),review:true})+mapSection(2,{me:me,hl:mine[1],static:true});
   }else{
    body='<div class="fnext"><span class="ttl">2부 소개가 모두 끝났어요</span><span class="small">방금 들은 책의 후기를 남기고, 선생님 안내를 기다려요</span></div>'+bookPanel(b,{label:'방금 들은 책 · 후기를 남겨요',who:row[2],code:seatCode(row[0]),review:true});
   }
  }
 }
 return '<div class="view">'+bar+body+(S.msg.comment?'<p class="'+S.msg.comment[0]+'">'+esc(S.msg.comment[1])+'</p>':'')+'</div>';
}
function vExplore(){
 if(locked())return vFocus();
 var q=S.q.trim();
 var list=BOOKS.filter(function(b){
  if(S.filter==="p1"&&b.part!==1)return false;
  if(S.filter==="p2"&&b.part!==2)return false;
  if(q&&(b.t+b.a+b.p+b.h).indexOf(q)<0)return false;
  return true});
 function chip(v,l){return '<button class="btn sm '+(S.filter===v?"":"ghost")+'" data-act="filter" data-arg="'+v+'">'+l+'</button>'}
 return '<div class="view"><div><h1 class="h1">고전 탐험하기</h1><p class="lede">마음에 드는 책을 꺼내 보세요. 소개 자료로 바로 갈 수 있고, 보고 나면 반응도 남길 수 있어요.</p></div>'
 +(isShare()?'<p class="notice">다른 반 친구들을 위한 공유 화면이에요. 댓글은 선생님이 확인한 뒤 보여요.</p>':'')
 +'<div class="row">'+chip("all","전체")+chip("p1","1부")+chip("p2","2부")
 +'<input id="q" type="search" aria-label="책 찾기" placeholder="제목, 작가로 찾기" style="max-width:260px" value="'+esc(S.q)+'" data-input="q"></div>'
 +'<div class="row"><button class="btn sm '+(S.look==="shelf"?"":"ghost")+'" data-act="look" data-arg="shelf">책장으로 보기</button><button class="btn sm '+(S.look==="grid"?"":"ghost")+'" data-act="look" data-arg="grid">표지로 보기</button><button class="btn sm '+(S.look==="map"?"":"ghost")+'" data-act="look" data-arg="map">배치도로 보기</button></div>'
 +(S.look==="map"?mapHtml(list):list.length?(S.look==="shelf"?shelfHtml(list):'<div class="grid">'+list.map(function(b){
   var d=db.books[b.k]||{};var has=canvaOf(b)||safeUrl(d.web);
   return '<button class="bk" data-act="open" data-arg="'+b.i+'">'+coverHtml(b)+'<span class="bk-title">'+esc(b.t)+'</span><span class="bk-tag">'+bookTag(b)+(has?"":" · 링크 준비 중")+'</span></button>'}).join("")+'</div>')
  :'<p class="lede">찾는 책이 없어요. 다른 낱말로 찾아보세요.</p>')+'</div>';
}
function shelfHtml(list){
 var enter=S.enter,n=0;
 function spine(b,last){
  var c=COLORS[b.i%COLORS.length],h=86+(b.i*37%15),w=62+(b.i*23%20);
  var pr=last;
  var st='--c1:'+c[0]+';--c2:'+c[1]+';--h:'+h+'%;--w:'+w+'px;--d:'+(n++*45)+'ms';
  return '<button class="spine'+(pr?" pr":"")+'" data-act="open" data-arg="'+b.i+'" style="'+st+'" aria-label="'+esc(b.t)+' 꺼내 보기"><span class="sp"><b>'+esc(b.t)+'</b><i>'+esc(b.a)+'</i></span><span class="pop" aria-hidden="true">'+coverHtml(b)+'</span></button>';
 }
 return [[1,"1부 책장"],[2,"2부 책장"]].map(function(p){
  var inPart=list.filter(function(b){return b.part===p[0]});
  if(!inPart.length)return "";
  var nos=[];inPart.forEach(function(b){if(nos.indexOf(b.no)<0)nos.push(b.no)});
  var seen=0;
  var row=nos.map(function(no){
   var g=inPart.filter(function(b){return b.no===no});
   var end='<span class="end">'+(no?no+'모둠 · '+THEME[no]:'자료 열람')+'</span>';
   return end+g.map(function(b){seen++;return spine(b,seen>inPart.length/2)}).join("");
  }).join("");
  return '<section class="shelf'+(enter?" enter":"")+'"><h2 class="plate">'+p[1]+'</h2><div class="rowbox"><div class="shelfrow">'+row+'</div></div><div class="plank"></div></section>';
 }).join("");
}
/* ---------- 자리 배치도 ----------
   ㄷ자 대형, 뚫린 쪽이 교실 뒤. 칠판에 서서 교실 뒤를 바라볼 때
   오른쪽 줄: 1-1(가장 뒤)→1-3, 칠판 쪽 줄: 2-1(오른쪽)→2-3, 왼쪽 줄: 3-1(칠판 쪽)→3-3(후문 쪽).
   칠판 쪽 3자리는 양옆 줄(3-1, 1-3) 바로 밑이 아니라 그 사이 가운데에 놓여요.
   그림은 위가 교실 뒤, 아래가 칠판이라 화면의 오른쪽이 곧 그 사람의 오른쪽이에요.
   2부는 2구역이 2자리라서 9자리 대형을 그대로 두고 가운데(2-2 자리)를 비우고, 2구역-2를 2-3 자리에 놓아요. */
var SLOT={
 1:[null,{r:2,c:6,pc:{r:2,c:7,f:"fl"},d:"h"},{r:3,c:6,pc:{r:3,c:7,f:"fl"},d:"h"},{r:4,c:6,pc:{r:4,c:7,f:"fl"},d:"h"}],
 2:[null,{r:5,c:5,pc:{r:6,c:5,f:"fu"},d:"v"},{r:5,c:4,pc:{r:6,c:4,f:"fu"},d:"v"},{r:5,c:3,pc:{r:6,c:3,f:"fu"},d:"v"}],
 3:[null,{r:4,c:2,pc:{r:4,c:1,f:"fr"},d:"h"},{r:3,c:2,pc:{r:3,c:1,f:"fr"},d:"h"},{r:2,c:2,pc:{r:2,c:1,f:"fr"},d:"h"}]
};
function seatsOf(part){
 var P=part===1?P1:P2,out=[];
 P.forEach(function(x){var m=x[0].match(/(\d)구역-(\d)/),z=+m[1],n=+m[2];
  var slot=(part===2&&z===2&&n===2)?3:n;
  out.push({z:z,slot:slot,code:z+"-"+n,full:x[0],k:x[1],who:x[2]})});
 [1,2,3].forEach(function(z){[1,2,3].forEach(function(s){if(!out.some(function(o){return o.z===z&&o.slot===s}))out.push({z:z,slot:s,off:true})})});
 return out;
}
function listenersAt(part,k,r){var V=part===1?V2:V1;return ko(V).filter(function(n){return V[n][r-1]===k})}
function seatCode(full){var m=String(full).match(/(\d)구역-(\d)/);return m?m[1]+"-"+m[2]:full}
/* o: me(강조할 학생), list(보이는 책), q(검색어), round(이 회차 듣는 사람 표시), hl(깜빡일 책), big(전자칠판용) */
function mapGrid(part,OPT){
 OPT=OPT||{};var me=OPT.me||"",q=OPT.q||"",list=OPT.list||BOOKS,share=isShare();
 var tour=V1[me]?{part:2,list:V1[me]}:V2[me]?{part:1,list:V2[me]}:null;
  var cells=seatsOf(part).map(function(o){
   var sl=SLOT[o.z][o.slot],pos='grid-row:'+sl.r+';grid-column:'+sl.c;
   var pcpos='grid-row:'+sl.pc.r+';grid-column:'+sl.pc.c;
   if(o.off)return '<div class="seat off '+sl.d+'" style="'+pos+'">빈자리</div><span class="pc off" style="'+pcpos+'" aria-hidden="true"></span>';
   var b=byK[o.k],mine=o.who===me,ti=tour&&tour.part===part?tour.list.indexOf(o.k):-1;
   var dim=list.indexOf(b)<0||(q&&(b.t+b.a+b.p+b.h+o.who).indexOf(q)<0);
   var ls=OPT.round?listenersAt(part,o.k,OPT.round):null;
   var badge=mine?'<span class="s-badge">내 부스</span>':ti>=0?'<span class="s-badge" style="background:var(--accent);color:var(--on-accent)">내 '+(ti+1)+'회차</span>':'';
   var nm=share?"발표":o.who.slice(1);
   return '<button class="seat '+sl.d+(OPT.hl===o.k?" hl":mine?" mine":ti>=0?" tour":"")+(dim?" dim":"")+'" style="'+pos+'"'+(OPT.static?' tabindex="-1"':' data-act="open" data-arg="'+b.i+'"')+' aria-label="'+esc(o.full+" "+b.t+(share?"":" · 발표 "+o.who))+'">'+coverHtml(b)+'<span class="s-txt"><span class="s-code">'+o.code+'</span><span class="s-t">'+esc(b.t)+'</span>'+(ls?(ls.length?'<span class="s-ls">→ '+esc(ls.join(", "))+'</span>':'<span class="s-ls free">참관자</span>'):badge)+'</span></button>'
   +'<span class="pc '+sl.pc.f+'" style="'+pcpos+'" title="'+esc(share?"발표자 자리":o.who+" 발표 자리")+'">'+esc(nm)+'</span>';
  }).join("");
  return '<div class="mapwrap"><div class="map'+(OPT.big?" big":"")+'" role="group" aria-label="'+part+'부 자리 배치도"><div class="m-back"><span class="m-door">후문</span><span>교실 뒤 · 열린 쪽</span><span></span></div>'
  +'<div class="m-floor">청중은 가운데를 돌아다니며 들어요</div>'+cells+'<div class="m-board">칠판</div></div></div>';
}
function mapSection(part,o){return '<section class="mapbox"><h2 class="h2">'+part+'부 자리 배치도 <span class="small">'+(part===1?"9자리":"8자리 · 가운데 빈자리")+'</span></h2>'+mapGrid(part,o)+'</section>'}
function mapHtml(list){
 var me=uname(),q=S.q.trim();
 var parts=S.filter==="p1"?[1]:S.filter==="p2"?[2]:[1,2];
 var tour=V1[me]||V2[me];
 var maps=parts.map(function(part){return mapSection(part,{me:me,list:list,q:q})}).join("");
 var extra=BOOKS.filter(function(b){return b.viewOnly&&list.indexOf(b)>=0&&parts.indexOf(b.part)>=0});
 return '<div class="legend"><span><b>동그라미</b> 발표자가 서는 곳. 벽을 등지고 교실 안을 바라봐요</span><span><b>책상</b> 누르면 책과 발표 자료가 열려요</span>'+(tour?'<span><b style="color:var(--stamp)">빨간 테두리</b> 내 부스 · <b style="color:var(--accent)">파란 테두리</b> 내가 들으러 갈 곳</span>':'')+'</div>'
 +'<div class="maps">'+maps+'</div>'
 +(extra.length?'<div class="row"><span class="small">부스 없이 자료만 보는 책</span>'+extra.map(function(b){return '<button class="btn ghost sm" data-act="open" data-arg="'+b.i+'">'+esc(b.t)+'</button>'}).join("")+'</div>':'');
}
function vPoster(){
 var b=BOOKS[S.poster.i],ps=posters(b),two=ps.length>1,f=locked();
 return '<div class="poverlay" data-act="pclose-bg" role="dialog" aria-modal="true" aria-label="'+esc(b.t)+' 포스터">'
 +'<div class="pstage" data-stop="1"><button class="pflip'+(S.poster.side?" back":"")+'" data-act="'+(two?"pflip":"pnext")+'" aria-label="'+(two?"포스터 뒤집기":"책 자세히 보기")+'">'
 +'<img class="pface" src="'+ps[0]+'" alt="'+esc(b.t)+' 포스터'+(two?" 앞면":"")+'">'+(two?'<img class="pface b" src="'+ps[1]+'" alt="'+esc(b.t)+' 포스터 뒷면">':'')+'</button></div>'
 +'<div class="pcap" data-stop="1"><span class="t">'+esc(b.t)+(presenter(b.k)&&!isShare()?' <span class="small" style="color:#9fb8bb">· '+esc(presenter(b.k))+' 포스터</span>':'')+'</span>'
 +(two?'<button class="btn ghost" data-act="pflip">'+(S.poster.side?"앞면 보기":"뒷면 보기")+'</button>':'')
 +(f?'':'<button class="btn" data-act="pnext">책 자세히 보기 →</button>')+'<button class="btn ghost" data-act="pclose">닫기</button></div></div>';

function animPoster(from){
 var el=document.querySelector("#layer .pflip");if(!el||!from||!el.animate)return;
 if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 var to=el.getBoundingClientRect();if(!to.width)return;
 var dx=(from.left+from.width/2)-(to.left+to.width/2),dy=(from.top+from.height/2)-(to.top+to.height/2),sc=Math.max(.08,Math.min(from.width/to.width,from.height/to.height));
 el.animate([{transform:"translate("+dx+"px,"+dy+"px) scale("+sc+") rotateY(-35deg) rotateZ(-4deg)",opacity:.5},{transform:"translate(0,0) scale(1.03) rotateY(4deg)",opacity:1,offset:.75},{transform:"none",opacity:1}],{duration:720,easing:"cubic-bezier(.16,1,.3,1)"});
}
function openBook(i,from){
 S.msg.comment=null;
 if(posters(BOOKS[i]).length){S.poster={i:i,side:0};S.open=null;renderLayer();animPoster(from);var n=document.querySelector('#layer [data-act="pnext"].btn')||document.querySelector('#layer [data-act="pclose"]');if(n)n.focus({preventScroll:true});return}
 S.open=i;S.justOpen=true;renderLayer();S.justOpen=false;var c=document.querySelector("#layer .close");if(c)c.focus();
}

function readCover(i,file){
 return new Promise(function(done){
  var r=new FileReader();
  r.onerror=function(){done("read")};
  r.onload=function(){var im=new Image();
   im.onload=function(){
    var w=360,h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
    var k=BOOKS[i].k;db=load();var before=bd(k).cover;bd(k).cover=c.toDataURL("image/jpeg",.78);
    if(!save()){if(before)bd(k).cover=before;else delete bd(k).cover;done("full")}else done("")};
   im.onerror=function(){done("read")};im.src=r.result};
  r.readAsDataURL(file)});
}
var COVER_ERR={read:"이미지를 읽지 못했어요. JPG나 PNG로 올려 주세요.",full:"저장 공간이 부족해요. 다른 표지를 지운 뒤 다시 올려 주세요."};
function fileCover(i,file){readCover(i,file).then(function(err){S.msg.book=COVER_ERR[err]||"";S.msg.bulk=null;renderAll()})}
function findBook(line){var n=line.normalize("NFC").replace(/\s/g,"");
 return BOOKS.filter(function(b){var p=presenter(b.k);return (p&&n.indexOf(p)>=0)||n.indexOf(b.k.replace(/\s/g,""))>=0||n.indexOf(b.t.replace(/\s/g,""))>=0})[0]}
function pasteLinks(text){
 var ok=0,miss=[];db=load();
 text.split(/\r?\n/).forEach(function(line){
  if(!line.trim())return;
  var urls=line.match(/https?:\/\/[^\s"'<>]+/g);if(!urls){miss.push(line.trim().slice(0,30));return}
  var b=findBook(line.replace(/https?:\/\/\S+/g,""));if(!b){miss.push(line.trim().slice(0,30));return}
  urls.forEach(function(u){if(/canva\.(com|link)/i.test(u))bd(b.k).canva=u;else bd(b.k).web=u});ok++});
 save();
 if(REMOTE&&ok){var items=BOOKS.filter(function(b){var x=db.books[b.k];return x&&(x.canva||x.web)}).map(function(b){var x=db.books[b.k];return {k:b.k,canva:x.canva||"",web:x.web||""}});
  api({action:"books",pin:tPin(),items:items}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.links=["err","시트에 저장하지 못했어요. "+netErr(e)];renderAll()})}
 S.msg.links=[miss.length?"err":"ok",ok+"권의 링크를 저장했어요."+(miss.length?" 책을 찾지 못한 줄: "+miss.join(" / "):"")];renderAll();
}
function matchCover(name){var n=String(name).normalize("NFC").replace(/\s/g,"");return BOOKS.filter(function(b){return n.indexOf(String(b.y))>=0||n.indexOf(b.k.replace(/\s/g,""))>=0})[0]}
function bulkCovers(files){
 var list=[].slice.call(files),ok=0,miss=[],fail=0;
 list.reduce(function(p,f){return p.then(function(){var b=matchCover(f.name);if(!b){miss.push(f.name);return}return readCover(b.i,f).then(function(e){if(e)fail++;else ok++})})},Promise.resolve()).then(function(){
  S.msg.book="";S.msg.bulk=[(miss.length||fail)?"err":"ok",ok+"권의 표지를 올렸어요."+(fail?" "+fail+"개는 읽거나 저장하지 못했어요.":"")+(miss.length?" 맞는 책을 찾지 못한 파일: "+miss.join(", "):"")];renderAll()});
}

   var who=uname();if(!who){S.msg.comment=["err","이름을 적고 들어와야 반응을 남길 수 있어요."];renderLayer();break}
   var k=t.dataset.k||BOOKS[S.open].k;db=load();var ux=urec(who);ux.rx=ux.rx||{};ux.rx[k]=ux.rx[k]||{};var on=!ux.rx[k][arg];ux.rx[k][arg]=on;ux.last=Date.now();
   var rr=db.reactions[k]=db.reactions[k]||{};rr[arg]=Math.max(0,(rr[arg]||0)+(on?1:-1));save();
   if(REMOTE)(function(k,kind,on,who){api({action:"react",book:k,kind:kind,on:on,name:who,dev:"name:"+who}).catch(function(e){db=load();var u2=urec(who);if(u2.rx&&u2.rx[k])u2.rx[k][kind]=!on;var r2=db.reactions[k]=db.reactions[k]||{};r2[kind]=Math.max(0,(r2[kind]||0)+(on?-1:1));save();S.msg.comment=["err","반응을 저장하지 못했어요. "+netErr(e)];if(S.open!==null)renderLayer();else renderAll()})})(k,arg,on,who);
   S.bump=on?arg:null;if(S.open!==null)renderLayer();else renderAll();S.bump=null;
   var nb=document.querySelector('[data-act="rx"][data-arg="'+arg+'"]');if(nb)nb.focus({preventScroll:true});break;
  case"ulogout":var mo=my();delete mo.name;delete mo.me;delete mo.guest;setMy(mo);S.draft={};S.msg={};S.open=null;S.zoom=null;renderAll();var un=document.getElementById("uName");if(un)un.focus();break;
  case"zoom":S.zoom=+arg;renderLayer();break;
  case"unpost":unpost(arg);break;
  case"exDel":case"exMine":var who2=act==="exMine"?uname():arg,ek2=t.dataset.k,key2=who2+"|"+ek2;
   if(S.exDelAsk!==key2){S.exDelAsk=key2;if(S.open!==null)renderLayer();else renderAll();break}
   S.exDelAsk="";delExpect(who2,ek2);break;
  case"awnext":S.award.stage="champ";chime(true);renderLayer();break;

  case"zclose":S.zoom=null;renderLayer();break;
  case"zprev":S.zoom=Math.max(0,S.zoom-1);renderLayer();break;
  case"znext":S.zoom=Math.min(postList().length-1,S.zoom+1);renderLayer();break;
  case"logout":S.teacher=false;S.pin="";net.sig="";try{sessionStorage.removeItem("gojeon-t");sessionStorage.removeItem("gojeon-pin")}catch(x){}renderAll();break;
  case"covDel":db=load();delete bd(BOOKS[+arg].k).cover;save();renderAll();break;
  case"wipe":if(!S.wipe){S.wipe=true;renderAll();break}S.wipe=false;if(REMOTE)api({action:"wipe",pin:tPin()}).then(function(){net.sig="";pull()}).catch(function(e){S.msg.np=netErr(e);renderAll()});db=load();db.comments=[];db.reactions={};db.posts={};db.notes={};db.users={};db.expects=null;save();setMy(Object.assign(my(),{rx:{}}));renderAll();break;
  case"export":var keep=JSON.parse(JSON.stringify(db));var blob=new Blob([JSON.stringify(keep)],{type:"application/json"});var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="고전독서박람회-백업.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);break;
